name: YouTube Video Downloader

# Triggers the workflow manually from the "Actions" tab in GitHub.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'The action to perform: info or download'
        required: true
        default: 'info'
      video_url:
        description: 'The full YouTube video URL to process'
        required: true
      quality:
        description: 'The desired video quality (e.g., 720p)'
        required: false
        default: '720p'
      format:
        description: 'The desired format (mp4 or mp3)'
        required: false
        default: 'mp4'

jobs:
  process:
    runs-on: ubuntu-latest # Use the latest Ubuntu runner
    timeout-minutes: 15 # Set a timeout to prevent hanging

    steps:
      # Step 1: Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Specify your Python version

      # Step 3: Install dependencies
      - name: Install yt-dlp and ffmpeg
        run: |
          pip install yt-dlp
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # Step 4: Run the Python script based on the action
      - name: Process YouTube Video
        run: |
          if [ "${{ github.event.inputs.action }}" == "info" ]; then
            echo "Fetching video info for ${{ github.event.inputs.video_url }}"
            # Create a placeholder file with video info
            echo "Video info for ${{ github.event.inputs.video_url }}" > video_info.txt
            echo "Processing completed successfully" >> video_info.txt
          elif [ "${{ github.event.inputs.action }}" == "download" ]; then
            echo "Downloading video in ${{ github.event.inputs.quality }} ${{ github.event.inputs.format }}"
            python runner/youtube_downloader.py "${{ github.event.inputs.video_url }}" "${{ github.event.inputs.quality }}" "${{ github.event.inputs.format }}"
          fi

      # Step 5: Upload the result as an artifact
      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-result
          path: |
            video_output/
            video_info.txt
          retention-days: 5 # Optional: Set how long to keep the artifact
        if: always() # Upload artifacts even if the job fails
