# Update the .github/workflows/youtube-downloader.yml file

name: YouTube Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube video URL'
        required: true
        type: string
      session_id:
        description: 'Unique session identifier'
        required: true
        type: string
      action:
        description: 'Action to perform (info or download)'
        required: true
        type: string
        default: 'info'
      quality:
        description: 'Video quality (for download action)'
        required: false
        type: string
        default: '720p'
      format:
        description: 'Output format (mp4 or mp3)'
        required: false
        type: string
        default: 'mp4'

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Process YouTube Video
        id: process_video
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url }}
          SESSION_ID: ${{ github.event.inputs.session_id }}
          ACTION: ${{ github.event.inputs.action }}
          QUALITY: ${{ github.event.inputs.quality }}
          FORMAT: ${{ github.event.inputs.format }}
        run: |
          # Create a session marker file for easier tracking
          echo "Session ID: $SESSION_ID" > session_marker_${SESSION_ID}.txt
          echo "Video URL: $VIDEO_URL" >> session_marker_${SESSION_ID}.txt
          echo "Action: $ACTION" >> session_marker_${SESSION_ID}.txt
          echo "Timestamp: $(date +%s)" >> session_marker_${SESSION_ID}.txt
          
          # Run the Python script and capture both stdout and stderr
          python runner/youtube_downloader.py > script_output.txt 2>&1 || true
          
          # Display the output for debugging
          echo "=== Script Output ==="
          cat script_output.txt
          
          # List all files created for debugging
          echo "=== Files Created ==="
          ls -la *.json *.txt *.mp4 *.mp3 *.webm *.m4a 2>/dev/null || echo "No media files found"
          
          # Try to find the results in the script output
          if grep -q "results=" script_output.txt; then
            # Extract the JSON results
            grep "results=" script_output.txt | sed 's/results=//' > "results_${SESSION_ID}.json"
            echo "Results extracted to results_${SESSION_ID}.json"
          else
            # If no results found, create an error response
            echo '{"status": "error", "message": "No results found in script output"}' > "results_${SESSION_ID}.json"
          fi
          
          # Display the extracted results for debugging
          echo "=== Extracted Results ==="
          cat "results_${SESSION_ID}.json"

      - name: Upload Info Results (if info action)
        if: github.event.inputs.action == 'info'
        uses: actions/upload-artifact@v4
        with:
          name: video-info-${{ github.event.inputs.session_id }}
          path: |
            video_info_${{ github.event.inputs.session_id }}.json
            results_${{ github.event.inputs.session_id }}.json
            error_${{ github.event.inputs.session_id }}.json
          retention-days: 1

      - name: Upload Download Results (if download action)
        if: github.event.inputs.action == 'download'
        uses: actions/upload-artifact@v4
        with:
          name: video-download-${{ github.event.inputs.session_id }}
          path: |
            video_${{ github.event.inputs.session_id }}.*
            video_download_${{ github.event.inputs.session_id }}.json
            results_${{ github.event.inputs.session_id }}.json
            error_${{ github.event.inputs.session_id }}.json
          retention-days: 1

      - name: Upload Session Marker
        uses: actions/upload-artifact@v4
        with:
          name: session-marker-${{ github.event.inputs.session_id }}
          path: session_marker_${{ github.event.inputs.session_id }}.txt
          retention-days: 1
