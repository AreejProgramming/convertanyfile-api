# .github/workflows/download.yml

name: YouTube Video Downloader

# Triggers the workflow manually from the "Actions" tab in GitHub.
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'The full YouTube video URL to download'
        required: true
        default: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'

jobs:
  download:
    runs-on: ubuntu-latest # Use the latest Ubuntu runner

    steps:
      # Step 1: Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Specify your Python version

      # Step 3: Install dependencies
      - name: Install yt-dlp
        run: pip install yt-dlp

      # Step 4: Run the Python download script
      - name: Download YouTube Video
        run: python runner/youtube_downloader.py "${{ github.event.inputs.video_url }}"

      # Step 5: Upload the downloaded video as an artifact
      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: video_output/ # The directory where the video was saved
          retention-days: 5 # Optional: Set how long to keep the artifact
