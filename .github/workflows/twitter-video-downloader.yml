const processTwitterResults = (data, originalUrl) => {
  if (data.status === 'no_video') {
    // Return a special result for tweets without videos
    return {
      ...data.data,
      url: originalUrl,
      noVideo: true,
      message: data.message
    };
  }
  
  if (data.status !== 'success') {
    throw new Error(data.message || 'Analysis failed');
  }
  
  return { ...data.data, url: originalUrl };
};
