name: Pinterest Video Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Pinterest URL to analyze'
        required: true
      session_id:
        description: 'Unique session ID for tracking'
        required: true

jobs:
  download-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: runner/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml
          
      - name: Create session marker
        run: |
          mkdir -p artifacts
          echo "Session ${{ github.event.inputs.session_id }}" > artifacts/session-marker-${{ github.event.inputs.session_id }}.txt
          
      - name: Analyze Pinterest URL
        run: |
          python runner/pinterest_downloader.py --url "${{ github.event.inputs.url }}" --output artifacts/pinterest_results_${{ github.event.inputs.session_id }}.json
          
      - name: Upload session marker
        uses: actions/upload-artifact@v4
        with:
          name: session-marker-${{ github.event.inputs.session_id }}
          path: artifacts/session-marker-${{ github.event.inputs.session_id }}.txt
          retention-days: 1
          
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: pinterest-results-${{ github.event.inputs.session_id }}
          path: artifacts/pinterest_results_${{ github.event.inputs.session_id }}.json
          retention-days: 1
