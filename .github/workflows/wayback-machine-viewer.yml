                    marginBottom: '1.5rem'
                  }}>
                    <div style={{ backgroundColor: darkMode ? '#2a2a2a' : '#f9fafb', padding: '1rem', borderBottom: `1px solid ${darkMode ? '#555' : '#e5e7eb'}` }}>
