                        Snapshot Preview
                      </h4>
                    </div>
                    <div style={{ padding: '1rem' }}>
                      <div style={{
                        backgroundColor: darkMode ? '#383838' : '#f8f9fa',
                        padding: '10px',
                        borderLeft: '4px solid #4285f4',
                        marginBottom: '20px',
                        fontSize: '0.875rem',
                        color: darkMode ? '#ccc' : '#5f6368'
                      }}>
