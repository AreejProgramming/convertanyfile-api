                      </div>
                      <div style={{
                        backgroundColor: darkMode ? '#2a2a2a' : '#f9fafb',
                        padding: '1rem',
                        borderRadius: '8px',
                        maxHeight: '300px',
                        overflow: 'auto',
                        fontSize: '0.875rem',
                        color: darkMode ? '#f0f0f0' : '#374151',
                        fontFamily: 'monospace',
                        lineHeight: '1.5'
                      }}>
                        <div style={{ marginBottom: '1rem' }}>
                          <strong>&lt;!DOCTYPE html&gt;</strong>
                        </div>
                        <div style={{ marginBottom: '1rem', marginLeft: '1rem' }}>
                          <strong>&lt;html&gt;</strong>
                        </div>
                        <div style={{ marginBottom: '1rem', marginLeft: '2rem' }}>
                          <strong>&lt;head&gt;</strong>
                        </div>
                        <div style={{ marginBottom: '1rem', marginLeft: '3rem' }}>
                          <strong>&lt;title&gt;</strong> {results.domain} - {selectedSnapshot.displayDate} <strong>&lt;/title&gt;</strong>
                        </div>
                        <div style={{ marginBottom: '1rem', marginLeft: '3rem' }}>
                          <strong>&lt;meta name="description" content="</strong>This is archived version of {results.domain} from {selectedSnapshot.displayDate}<strong>"&gt;</strong>
                        </div>
                        <div style={{ marginBottom: '1rem', marginLeft: '2rem' }}>
                          <strong>&lt;/head&gt;</strong>
                        </div>
                        <div style={{ marginBottom: '1rem', marginLeft: '2rem' }}>
                          <strong>&lt;body&gt;</strong>
                        </div>
                        <div style={{ marginBottom: '1rem', marginLeft: '3rem' }}>
                          <strong>&lt;h1&gt;</strong> Welcome to {results.domain} <strong>&lt;/h1&gt;</strong>
                        </div>
                        <div style={{ marginBottom: '1rem', marginLeft: '3rem' }}>
                          <strong>&lt;p&gt;</strong> This is archived content of webpage from {selectedSnapshot.displayDate}. In a real implementation, this would show actual archived HTML content from Wayback Machine. <strong>&lt;/p&gt;</strong>
                        </div>
                        <div style={{ marginBottom: '1rem', marginLeft: '2rem' }}>
                          <strong>&lt;/body&gt;</strong>
                        </div>
                        <div style={{ marginBottom: '1rem', marginLeft: '1rem' }}>
                          <strong>&lt;/html&gt;</strong>
                        </div>
                      </div>
                      <div style={{ marginTop: '1rem', display: 'flex', gap: '1rem' }}>
                        <a
                          href={selectedSnapshot.url}
                          target="_blank"
                          rel="noopener noreferrer"
                          style={{
                            padding: '0.75rem 1.5rem',
                            fontSize: '0.875rem',
                            fontWeight: '600',
                            color: 'white',
                            background: toolConfig.gradient,
                            border: 'none',
                            borderRadius: '8px',
                            cursor: 'pointer',
                            display: 'inline-flex',
                            alignItems: 'center',
                            gap: '0.5rem',
                            textDecoration: 'none'
                          }}
                        >
                          <ExternalLink size={16} />
                          View Full Snapshot
                        </a>
                        <a
                          href={results.url}
                          target="_blank"
                          rel="noopener noreferrer"
                          style={{
                            padding: '0.75rem 1.5rem',
                            fontSize: '0.875rem',
                            fontWeight: '600',
                            color: darkMode ? '#f0f0f0' : '#4b5563',
                            background: darkMode ? '#333' : 'white',
                            border: `1px solid ${darkMode ? '#555' : '#d1d5db'}`,
                            borderRadius: '8px',
                            cursor: 'pointer',
                            display: 'inline-flex',
                            alignItems: 'center',
                            gap: '0.5rem',
                            textDecoration: 'none'
                          }}
                        >
                          <Globe size={16} />
                          Visit Current Page
                        </a>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          <section style={{ 
            background: darkMode ? '#2a2a2a' : 'white', 
            borderRadius: '16px', 
            padding: isMobile ? '1.5rem 1rem' : '2rem', 
            border: `2px solid ${darkMode ? '#444' : '#E5E7EB'}`, 
            marginBottom: '2rem' 
          }}>
            <h2 style={{ 
              fontSize: isMobile ? '1.5rem' : '1.75rem', 
              fontWeight: '700', 
              color: darkMode ? '#f0f0f0' : '#111827', 
              marginBottom: '1rem', 
              marginTop: 0 
            }}>
              How to Use Wayback Machine Viewer
            </h2>
            <p style={{ 
              fontSize: isMobile ? '0.9rem' : '1rem', 
              lineHeight: '1.8', 
              color: darkMode ? '#ccc' : '#6B7280', 
              marginBottom: '1.5rem' 
            }}>
              The Wayback Machine allows you to view historical snapshots of websites and track changes over time.
            </p>
            
            <h3 style={{ 
              fontSize: isMobile ? '1.1rem' : '1.25rem', 
              fontWeight: '700', 
              color: darkMode ? '#f0f0f0' : '#111827', 
              marginBottom: '0.75rem', 
              marginTop: '1.5rem' 
            }}>
              Step-by-Step Guide
            </h3>
            <ol style={{ 
              fontSize: isMobile ? '0.9rem' : '1rem', 
              lineHeight: '1.8', 
              color: darkMode ? '#ccc' : '#6B7280', 
              paddingLeft: '1.5rem' 
            }}>
              <li style={{ marginBottom: '0.75rem' }}>
                <strong style={{ color: darkMode ? '#f0f0f0' : '#111827' }}>Enter URL:</strong> Type website URL you want to check in input field.
              </li>
              <li style={{ marginBottom: '0.75rem' }}>
                <strong style={{ color: darkMode ? '#f0f0f0' : '#111827' }}>View History:</strong> Click "View History" button to search for archived snapshots.
              </li>
              <li style={{ marginBottom: '0.75rem' }}>
                <strong style={{ color: darkMode ? '#f0f0f0' : '#111827' }}>Browse Snapshots:</strong> Explore timeline of available snapshots, sorted by date.
              </li>
              <li style={{ marginBottom: '0.75rem' }}>
                <strong style={{ color: darkMode ? '#f0f0f0' : '#111827' }}>Select Snapshot:</strong> Click on any snapshot to preview archived content.
              </li>
            </ol>
          </section>

          <section style={{ 
            background: darkMode ? '#2a2a2a' : 'white', 
            borderRadius: '20px', 
            padding: isMobile ? '1.5rem 1rem' : '2rem', 
            border: `2px solid ${darkMode ? '#444' : '#E5E7EB'}`, 
            marginBottom: '2rem' 
          }}>
            <h2 style={{ 
              fontSize: isMobile ? '1.5rem' : '1.75rem', 
              fontWeight: '700', 
              color: darkMode ? '#f0f0f0' : '#111827', 
              marginBottom: '1.5rem', 
              marginTop: 0 
            }}>
              Key Features
            </h2>
            <div style={{ 
              display: 'grid', 
              gridTemplateColumns: isMobile ? '1fr' : 'repeat(auto-fit, minmax(250px, 1fr))', 
              gap: '1.5rem' 
            }}>
              <article>
                <div style={{ 
                  width: '48px', 
                  height: '48px', 
                  background: darkMode ? '#383838' : '#F0F4FF', 
                  borderRadius: '12px', 
                  display: 'flex', 
                  alignItems: 'center', 
                  justifyContent: 'center', 
                  marginBottom: '1rem' 
                }}>
                  <Archive size={24} color="#f093fb" strokeWidth={2.5} aria-label="Archive icon" />
                </div>
                <h3 style={{ 
                  fontSize: isMobile ? '1rem' : '1.1rem', 
                  fontWeight: '700', 
                  color: darkMode ? '#f0f0f0' : '#111827', 
                  marginBottom: '0.5rem', 
                  marginTop: 0 
                }}>
                  Historical Snapshots
                </h3>
                <p style={{ 
                  fontSize: isMobile ? '0.85rem' : '0.95rem', 
                  lineHeight: '1.6', 
                  color: darkMode ? '#ccc' : '#6B7280', 
                  margin: 0 
                }}>
                  Access archived versions of websites from different points in time.
                </p>
              </article>
              <article>
                <div style={{ 
                  width: '48px', 
                  height: '48px', 
                  background: darkMode ? '#383838' : '#F0F4FF', 
                  borderRadius: '12px', 
                  display: 'flex', 
                  alignItems: 'center', 
                  justifyContent: 'center', 
                  marginBottom: '1rem' 
                }}>
                  <Calendar size={24} color="#f093fb" strokeWidth={2.5} aria-label="Calendar icon" />
                </div>
                <h3 style={{ 
                  fontSize: isMobile ? '1rem' : '1.1rem', 
                  fontWeight: '700', 
                  color: darkMode ? '#f0f0f0' : '#111827', 
                  marginBottom: '0.5rem', 
                  marginTop: 0 
                }}>
                  Timeline View
                </h3>
                <p style={{ 
                  fontSize: isMobile ? '0.85rem' : '0.95rem', 
                  lineHeight: '1.6', 
                  color: darkMode ? '#ccc' : '#6B7280', 
                  margin: 0 
                }}>
                  Browse through a chronological timeline of website changes.
                </p>
              </article>
              <article>
                <div style={{ 
                  width: '48px', 
                  height: '48px', 
                  background: darkMode ? '#383838' : '#F0F4FF', 
                  borderRadius: '12px', 
                  display: 'flex', 
                  alignItems: 'center', 
                  justifyContent: 'center', 
                  marginBottom: '1rem' 
                }}>
                  <Globe size={24} color="#f093fb" strokeWidth={2.5} aria-label="Globe icon" />
                </div>
                <h3 style={{ 
                  fontSize: isMobile ? '1rem' : '1.1rem', 
                  fontWeight: '700', 
                  color: darkMode ? '#f0f0f0' : '#111827', 
                  marginBottom: '0.5rem', 
                  marginTop: 0 
                }}>
                  Preview Functionality
                </h3>
                <p style={{ 
                  fontSize: isMobile ? '0.85rem' : '0.95rem', 
                  lineHeight: '1.6', 
                  color: darkMode ? '#ccc' : '#6B7280', 
                  margin: 0 
                }}>
                  Preview archived content before visiting the full snapshot.
                </p>
              </article>
            </div>
          </section>

          <section style={{ 
            background: darkMode ? '#2a2a2a' : 'white', 
            borderRadius: '16px', 
            padding: isMobile ? '1.5rem 1rem' : '2rem', 
            border: `2px solid ${darkMode ? '#444' : '#E5E7EB'}`, 
            marginBottom: '2rem' 
          }}>
            <h2 style={{ 
              fontSize: isMobile ? '1.5rem' : '1.75rem', 
              fontWeight: '700', 
              color: darkMode ? '#f0f0f0' : '#111827', 
              marginBottom: '1rem', 
              marginTop: 0 
            }}>
              Frequently Asked Questions
            </h2>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
              {faqs.map((faq, index) => (
                <div key={index} style={{ 
                  border: `2px solid ${darkMode ? '#444' : '#E5E7EB'}`, 
                  borderRadius: '12px', 
                  overflow: 'hidden' 
                }}>
                  <button
                    onClick={() => toggleFaq(index)}
                    style={{
                      width: '100%',
                      padding: isMobile ? '1rem' : '1.25rem',
                      background: expandedFaq === index ? 
                        (darkMode ? '#383838' : '#F0F4FF') : 
                        (darkMode ? '#333' : 'white'),
                      border: 'none',
                      cursor: 'pointer',
                      display: 'flex',
                      justifyContent: 'space-between',
                      alignItems: 'center',
                      textAlign: 'left',
                      transition: 'background 0.2s'
                    }}
                  >
                    <h3 style={{ 
                      fontSize: isMobile ? '0.95rem' : '1.05rem', 
                      fontWeight: '600', 
                      color: darkMode ? '#f0f0f0' : '#111827', 
                      margin: 0 
                    }}>
                      {faq.question}
                    </h3>
                    {expandedFaq === index ? 
                      <ChevronUp size={20} color={darkMode ? '#ccc' : '#6B7280'} style={{ flexShrink: 0, marginLeft: '1rem' }} /> : 
                      <ChevronDown size={20} color={darkMode ? '#ccc' : '#6B7280'} style={{ flexShrink: 0, marginLeft: '1rem' }} />
                    }
                  </button>
                  {expandedFaq === index && (
                    <div style={{ 
                      padding: isMobile ? '0 1rem 1rem' : '0 1.25rem 1.25rem', 
                      background: darkMode ? '#383838' : '#F0F4FF' 
                    }}>
                      <p style={{ 
                        fontSize: isMobile ? '0.85rem' : '0.95rem', 
                        lineHeight: '1.7', 
                        color: darkMode ? '#ccc' : '#6B7280', 
                        margin: 0 
                      }}>
                        {faq.answer}
                      </p>
                    </div>
                  )}
                </div>
              ))}
            </div>
          </section>

          <footer style={{ 
            textAlign: 'center', 
            color: darkMode ? '#9CA3AF' : '#9CA3AF', 
            marginTop: '3rem', 
            fontSize: isMobile ? '0.85rem' : '0.95rem', 
            fontWeight: '500' 
          }}>
            Built with modern web technology • No installation required • Privacy-first design
          </footer>
        </div>
        <style>{`@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }`}</style>
      </div>
    </>
  );
};

export default WaybackMachineViewerTool;
