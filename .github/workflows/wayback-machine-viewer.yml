                          <div style={{
                            display: 'flex',
                            justifyContent: 'center',
                            alignItems: 'center',
                            width: '40px',
                            height: '40px',
                            borderRadius: '50%',
                            backgroundColor: snapshot.status === 'success' ? 
                              (darkMode ? '#2a4a3a' : '#d1fae5') : 
                              (darkMode ? '#3a2a1a' : '#fef3c7'),
                            flexShrink: 0
                          }}>
                            {snapshot.status === 'success' ? (
                              <CheckCircle size={20} color="#10b981" />
                            ) : (
                              <ChevronRight size={20} color="#f59e0b" />
                            )}
                          </div>
                          <div style={{ flex: 1 }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                              <div>
                                <p style={{ margin: 0, fontSize: '0.9rem', color: darkMode ? '#f0f0f0' : '#111827', fontWeight: '600' }}>
                                  {snapshot.displayDate} {snapshot.displayTime}
                                </p>
                                <p style={{ margin: '0.25rem 0 0 0', fontSize: '0.8rem', color: darkMode ? '#ccc' : '#6b7280' }}>
                                  {snapshot.status === 'success' ? 'Successful snapshot' : 'Redirected page'} • {snapshot.size}
                                </p>
                              </div>
                              <ExternalLink size={16} color={darkMode ? '#ccc' : '#6b7280'} />
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* Selected Snapshot Preview */}
                {selectedSnapshot && (
                  <div style={{
                    backgroundColor: darkMode ? '#333' : 'white',
                    border: `1px solid ${darkMode ? '#555' : '#e5e7eb'}`,
                    borderRadius: '12px',
                    overflow: 'hidden'
                  }}>
                    <div style={{ backgroundColor: darkMode ? '#2a2a2a' : '#f9fafb', padding: '1rem', borderBottom: `1px solid ${darkMode ? '#555' : '#e5e7eb'}` }}>
