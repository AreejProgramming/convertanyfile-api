                          style={{
                            padding: '1rem',
                            borderBottom: index < results.snapshots.length - 1 ? `1px solid ${darkMode ? '#444' : '#e5e7eb'}` : 'none',
                            cursor: 'pointer',
                            backgroundColor: selectedSnapshot === snapshot ? 
                              (darkMode ? '#383838' : '#f9fafb') : 
                              (darkMode ? '#333' : 'white'),
                            display: 'flex',
                            alignItems: 'center',
                            gap: '1rem',
                            transition: 'background-color 0.2s'
                          }}
                          onMouseEnter={(e) => {
                            if (selectedSnapshot !== snapshot) {
                              e.currentTarget.style.backgroundColor = darkMode ? '#383838' : '#f9fafb';
                            }
                          }}
                          onMouseLeave={(e) => {
                            if (selectedSnapshot !== snapshot) {
                              e.currentTarget.style.backgroundColor = darkMode ? '#333' : 'white';
                            }
                          }}
