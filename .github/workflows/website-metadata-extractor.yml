# File: .github/workflows/website-metadata-extractor.yml

name: Website Metadata Extractor

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Website URL to extract metadata from'
        required: true
        default: 'https://example.com'
      session_id:
        description: 'Session ID for tracking'
        required: false
        default: ''

jobs:
  metadata-extraction:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4
        
    - name: Generate session ID if not provided
      if: github.event.inputs.session_id == ''
      run: |
        echo "SESSION_ID=$(date +%s)-$(shuf -i 1000-9999 -n 1)" >> $GITHUB_ENV
        
    - name: Use provided session ID
      if: github.event.inputs.session_id != ''
      run: |
        echo "SESSION_ID=${{ github.event.inputs.session_id }}" >> $GITHUB_ENV
        
    - name: Create session marker
      run: |
        echo "Session ID: $SESSION_ID"
        echo "Session marker created at $(date)"
        mkdir -p session-markers
        echo "Session ID: $SESSION_ID" > session-markers/session-marker-$SESSION_ID.txt
        
    - name: Upload session marker
      uses: actions/upload-artifact@v4
      with:
        name: session-marker-${{ env.SESSION_ID }}
        path: session-markers/
        retention-days: 1
        
    - name: Extract website metadata
      env:
        URL: ${{ github.event.inputs.url }}
        SESSION_ID: ${{ env.SESSION_ID }}
      run: |
        echo "Extracting metadata from $URL"
        python runner/website_metadata_extractor.py
        
    - name: Process results
      run: |
        # Check if results file exists
        if [ -f results.json ]; then
          echo "Results file found"
          # Create a copy with session ID in the filename
          cp results.json metadata_results_${{ env.SESSION_ID }}.json
          
          # Display results summary
          echo "Results summary:"
          if command -v jq &> /dev/null; then
            echo "Status: $(jq -r '.status' results.json)"
            if [ "$(jq -r '.status' results.json)" = "success" ]; then
              echo "URL: $(jq -r '.url' results.json)"
              echo "Title: $(jq -r '.data.title' results.json)"
              echo "Description: $(jq -r '.data.description' results.json)"
              echo "Keywords: $(jq -r '.data.keywords | join(\", \")' results.json)"
              echo "Open Graph: $(jq -r '.data.openGraph.title' results.json)"
              echo "Twitter: $(jq -r '.data.twitter.title' results.json)"
              echo "Schema: $(jq -r '.data.schema.\"@type\"' results.json)"
              echo "Images: $(jq -r '.data.images | length' results.json)"
              echo "Links: $(jq -r '.data.links | length' results.json)"
            else
              echo "Error: $(jq -r '.message' results.json)"
            fi
          else
            echo "jq not available, displaying raw JSON"
            cat results.json
          fi
        else
          echo "Results file not found"
          exit 1
        fi
        
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: metadata-results-${{ env.SESSION_ID }}
        path: |
          results.json
          metadata_results_${{ env.SESSION_ID }}.json
        retention-days: 7
