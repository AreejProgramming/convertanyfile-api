# .github/workflows/threads-video-downloader.yml
name: Threads Video Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Threads URL to analyze'
        required: true
      session_id:
        description: 'Unique session ID for tracking'
        required: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Use a larger runner for better performance with concurrent users
    strategy:
      matrix:
        node-version: [18]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp requests beautifulsoup4 lxml

      - name: Create session marker
        run: |
          mkdir -p artifacts
          echo "Session marker for ${{ github.event.inputs.session_id }}" > artifacts/session-marker-${{ github.event.inputs.session_id }}.txt

      - name: Analyze Threads URL with yt-dlp
        run: python runner/threads_downloader.py --url "${{ github.event.inputs.url }}" --session_id "${{ github.event.inputs.session_id }}"

      - name: Upload session marker
        uses: actions/upload-artifact@v4
        with:
          name: session-marker-${{ github.event.inputs.session_id }}
          path: artifacts/session-marker-${{ github.event.inputs.session_id }}.txt
          retention-days: 1

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: threads-results-${{ github.event.inputs.session_id }}
          path: artifacts/threads_results_${{ github.event.inputs.session_id }}.json
          retention-days: 1
