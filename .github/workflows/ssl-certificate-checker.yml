name: SSL Certificate Checker

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain to check SSL certificate for'
        required: true
        default: 'example.com'
      session_id:
        description: 'Session ID for tracking'
        required: false
        default: ''

jobs:
  check-ssl:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyopenssl
        
    - name: Generate session ID if not provided
      if: github.event.inputs.session_id == ''
      run: |
        echo "SESSION_ID=$(date +%s)-$(shuf -i 1000-9999 -n 1)" >> $GITHUB_ENV
        
    - name: Use provided session ID
      if: github.event.inputs.session_id != ''
      run: |
        echo "SESSION_ID=${{ github.event.inputs.session_id }}" >> $GITHUB_ENV
        
    - name: Create session marker
      run: |
        echo "Session ID: $SESSION_ID"
        echo "Session marker created at $(date)"
        mkdir -p session-markers
        echo "Session ID: $SESSION_ID" > session-markers/session-marker-$SESSION_ID.txt
        
    - name: Upload session marker
      uses: actions/upload-artifact@v4
      with:
        name: session-marker-${{ env.SESSION_ID }}
        path: session-markers/
        retention-days: 1
        
    - name: Check SSL certificate
      env:
        DOMAIN: ${{ github.event.inputs.domain }}
        SESSION_ID: ${{ env.SESSION_ID }}
      run: |
        echo "Checking SSL certificate for $DOMAIN"
        python runner/ssl_certificate_checker.py
        
    - name: Process results
      run: |
        # Check if results file exists
        if [ -f results.json ]; then
          echo "Results file found"
          # Create a copy with session ID in the filename
          cp results.json ssl_results_${{ env.SESSION_ID }}.json
          
          # Display results summary
          echo "Results summary:"
          if command -v jq &> /dev/null; then
            jq -r '.status' results.json
            if [ "$(jq -r '.status' results.json)" = "success" ]; then
              echo "Domain: $(jq -r '.domain' results.json)"
              echo "Is Secure: $(jq -r '.data.isSecure' results.json)"
              echo "Issuer: $(jq -r '.data.certificate.issuer' results.json)"
              echo "Subject: $(jq -r '.data.certificate.subject' results.json)"
              echo "Issued On: $(jq -r '.data.certificate.issuedOn' results.json)"
              echo "Expires On: $(jq -r '.data.certificate.expiresOn' results.json)"
              echo "Days Until Expiry: $(jq -r '.data.certificate.daysUntilExpiry' results.json)"
              echo "Key Size: $(jq -r '.data.certificate.keySize' results.json)"
              echo "Protocol: $(jq -r '.data.certificate.protocol' results.json)"
              echo "Cipher Suite: $(jq -r '.data.certificate.cipherSuite' results.json)"
              
              echo "Vulnerabilities:"
              jq -r '.data.vulnerabilities[] | "Name: \(.name), Status: \(.status), Severity: \(.severity)"' results.json
            else
              echo "Error: $(jq -r '.message' results.json)"
            fi
          else
            echo "jq not available, displaying raw JSON"
            cat results.json
          fi
        else
          echo "Results file not found"
          exit 1
        fi
        
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ssl-results-${{ env.SESSION_ID }}
        path: |
          results.json
          ssl_results_${{ env.SESSION_ID }}.json
        retention-days: 7
