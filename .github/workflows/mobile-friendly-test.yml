name: Mobile Friendly Test

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to test for mobile-friendliness'
        required: true
        default: 'https://example.com'

jobs:
  test-mobile-friendly:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install Chrome and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-chromedriver
        pip install requests selenium
        
    - name: Set up Selenium
      run: |
        # Download and set up ChromeDriver
        CHROMEDRIVER_VERSION=`curl -sS chromedriver.storage.googleapis.com/LATEST_RELEASE`
        sudo apt-get update
        sudo apt-get install -y chromium-browser
        wget -N http://chromedriver.storage.googleapis.com/$CHROMEDRIVER_VERSION/chromedriver_linux64.zip -P ~/
        unzip ~/chromedriver_linux64.zip -d ~/
        sudo mv ~/chromedriver /usr/local/bin/chromedriver
        sudo chmod +x /usr/local/bin/chromedriver
        
    - name: Generate session ID
      run: |
        echo "SESSION_ID=$(date +%s)-$(shuf -i 1000-9999 -n 1)" >> $GITHUB_ENV
        
    - name: Test mobile-friendliness
      env:
        URL: ${{ github.event.inputs.url }}
        SESSION_ID: ${{ env.SESSION_ID }}
      run: |
        echo "Testing mobile-friendliness for $URL"
        python runner/mobile_friendly_test_docker.py
        
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mobile-test-results-${{ env.SESSION_ID }}
        path: |
          results.json
        retention-days: 7
