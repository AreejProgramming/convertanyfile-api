name: Mobile Friendly Test

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to test for mobile-friendliness'
        required: true
        default: 'https://example.com'
      session_id:
        description: 'Session ID for tracking'
        required: false
        default: ''

jobs:
  test-mobile-friendly:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests selenium
        
    - name: Install Chrome and ChromeDriver
      run: |
        # Install Chrome
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        
        # Get Chrome version
        CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+')
        echo "Chrome version: $CHROME_VERSION"
        
        # Get the matching ChromeDriver version
        CHROMEDRIVER_VERSION=$(curl -s "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_$CHROME_VERSION")
        echo "ChromeDriver version: $CHROMEDRIVER_VERSION"
        
        # Download and install ChromeDriver
        curl -L -O "https://chromedriver.storage.googleapis.com/$CHROMEDRIVER_VERSION/chromedriver_linux64.zip"
        unzip chromedriver_linux64.zip
        sudo mv chromedriver /usr/local/bin/
        sudo chmod +x /usr/local/bin/chromedriver
        
    - name: Generate session ID if not provided
      if: github.event.inputs.session_id == ''
      run: |
        echo "SESSION_ID=$(date +%s)-$(shuf -i 1000-9999 -n 1)" >> $GITHUB_ENV
        
    - name: Use provided session ID
      if: github.event.inputs.session_id != ''
      run: |
        echo "SESSION_ID=${{ github.event.inputs.session_id }}" >> $GITHUB_ENV
        
    - name: Create session marker
      run: |
        echo "Session ID: $SESSION_ID"
        echo "Session marker created at $(date)"
        mkdir -p session-markers
        echo "Session ID: $SESSION_ID" > session-markers/session-marker-$SESSION_ID.txt
        
    - name: Upload session marker
      uses: actions/upload-artifact@v4
      with:
        name: session-marker-${{ env.SESSION_ID }}
        path: session-markers/
        retention-days: 1
        
    - name: Test mobile-friendliness
      env:
        URL: ${{ github.event.inputs.url }}
        SESSION_ID: ${{ env.SESSION_ID }}
      run: |
        echo "Testing mobile-friendliness for $URL"
        python runner/mobile_friendly_test.py
        
    - name: Process results
      run: |
        # Check if results file exists
        if [ -f results.json ]; then
          echo "Results file found"
          # Create a copy with session ID in the filename
          cp results.json mobile_test_results_${{ env.SESSION_ID }}.json
          
          # Display results summary
          echo "Results summary:"
          if command -v jq &> /dev/null; then
            jq -r '.status' results.json
            if [ "$(jq -r '.status' results.json)" = "success" ]; then
              echo "URL: $(jq -r '.url' results.json)"
              echo "Overall Score: $(jq -r '.data.overallScore' results.json)"
              echo "Mobile-Friendly: $(jq -r '.data.isMobileFriendly' results.json)"
              echo "Checks Passed: $(jq '[.data.checks[] | select(.status == "pass")] | length' results.json)/$(jq '.data.checks | length' results.json)"
            else
              echo "Error: $(jq -r '.message' results.json)"
            fi
          else
            echo "jq not available, displaying raw JSON"
            cat results.json
          fi
        else
          echo "Results file not found"
          exit 1
        fi
        
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mobile-test-results-${{ env.SESSION_ID }}
        path: |
          results.json
          mobile_test_results_${{ env.SESSION_ID }}.json
        retention-days: 7
