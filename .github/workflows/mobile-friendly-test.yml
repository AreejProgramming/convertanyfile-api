name: Mobile Friendly Test

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to test for mobile-friendliness'
        required: true
        default: 'https://example.com'

jobs:
  test-mobile-friendly:
    runs-on: ubuntu-latest  # Use GitHub's standard runner instead of container
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5  # Try newer version
      with:
        python-version: '3.10'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-driver chromium-browser xvfb
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests selenium webdriver-manager
        
    - name: Generate session ID
      run: |
        echo "SESSION_ID=$(date +%s)-$(shuf -i 1000-9999 -n 1)" >> $GITHUB_ENV
        
    - name: Test mobile-friendliness
      env:
        URL: ${{ github.event.inputs.url }}
        SESSION_ID: ${{ env.SESSION_ID }}
      run: |
        echo "Testing mobile-friendliness for $URL"
        python runner/mobile_friendly_test.py  # Use non-Docker version
        
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mobile-test-results-${{ env.SESSION_ID }}
        path: |
          results.json
          results_*.json
        retention-days: 7
