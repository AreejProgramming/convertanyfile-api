name: Mobile Friendly Test

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to test for mobile-friendliness'
        required: true
        default: 'https://example.com'
      session_id:
        description: 'Optional session ID for tracking'
        required: false
        default: ''

jobs:
  test-mobile-friendly:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml
        
    - name: Generate or use session ID
      run: |
        if [ -z "${{ github.event.inputs.session_id }}" ]; then
          echo "SESSION_ID=$(date +%s)-$(shuf -i 1000-9999 -n 1)" >> $GITHUB_ENV
        else
          echo "SESSION_ID=${{ github.event.inputs.session_id }}" >> $GITHUB_ENV
        fi
        echo "Using session ID: $SESSION_ID"
        
    - name: Create session marker
      run: |
        echo "Session ID: $SESSION_ID"
        echo "Session marker created at $(date)"
        mkdir -p session-markers
        echo "Session ID: $SESSION_ID" > session-markers/session-marker-$SESSION_ID.txt
        
    - name: Upload session marker
      uses: actions/upload-artifact@v4
      with:
        name: session-marker-${{ env.SESSION_ID }}
        path: session-markers/
        retention-days: 1
        
    - name: Test mobile-friendliness with free APIs
      env:
        URL: ${{ github.event.inputs.url }}
        SESSION_ID: ${{ env.SESSION_ID }}
      run: |
        echo "Testing mobile-friendliness for $URL with session ID $SESSION_ID"
        python runner/mobile_friendly_test_free.py
        
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mobile-test-results-${{ env.SESSION_ID }}
        path: |
          results.json
          results_*.json
        retention-days: 7
