name: Run Accessibility Analysis

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to analyze'
        required: true
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Set a timeout to prevent hanging
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'  # Cache pip dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps  # Install with deps

      - name: Run Accessibility Analysis
        id: run_analysis
        env:
          TARGET_URL: ${{ github.event.inputs.url }}
        run: |
          # Run the Python script and capture output
          python runner/main.py > script_output.txt 2>&1 || true
          
          # Try to find the results in the script output
          if grep -q "results=" script_output.txt; then
            # Extract the JSON results
            RESULTS_JSON=$(grep "results=" script_output.txt | sed 's/results=//')
            echo "results=$RESULTS_JSON" >> $GITHUB_OUTPUT
          else
            # If no results found, create an error response
            ERROR_JSON='{"status": "error", "message": "No results found in script output"}'
            echo "results=$ERROR_JSON" >> $GITHUB_OUTPUT
          fi

      - name: Output Results
        run: |
          # Output the results for debugging
          echo '${{ steps.run_analysis.outputs.results }}'
