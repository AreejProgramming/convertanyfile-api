name: Run Accessibility Analysis

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to analyze'
        required: true
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run Accessibility Analysis
        id: run_analysis
        env:
          TARGET_URL: ${{ github.event.inputs.url }}
        run: |
          # Create a temporary file for output
          OUTPUT_FILE="accessibility_results.json"
          
          # Run the Python script and capture output
          python runner/main.py > script_output.txt 2>&1 || true
          
          # Try to find the results in the script output
          if grep -q "results=" script_output.txt; then
            # Extract the JSON results
            grep "results=" script_output.txt | sed 's/results=//' > "$OUTPUT_FILE"
            echo "Results extracted to $OUTPUT_FILE"
          else
            # If no results found, create an error response
            echo '{"status": "error", "message": "No results found in script output"}' > "$OUTPUT_FILE"
          fi
          
          # Display the output for debugging
          echo "=== Script Output ==="
          cat script_output.txt
          echo "=== Extracted Results ==="
          cat "$OUTPUT_FILE"
          
          # Save the file path for the next step
          echo "output_file=$OUTPUT_FILE" >> $GITHUB_OUTPUT

      - name: Upload Results as Artifact
        uses: actions/upload-artifact@v3
        with:
          name: accessibility-results
          path: ${{ steps.run_analysis.outputs.output_file }}
          retention-days: 1
