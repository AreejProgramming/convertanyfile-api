name: Run Accessibility Analysis

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to analyze'
        required: true
        type: string

jobs:
  analyze:
    # Use larger runner for faster execution
    runs-on: ubuntu-latest-4-cores
    
    # Set a timeout to prevent hanging
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'  # Cache pip dependencies for faster setup

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          # Install only the browsers we need
          playwright install chromium --with-deps

      - name: Run Accessibility Analysis
        id: run_analysis
        env:
          TARGET_URL: ${{ github.event.inputs.url }}
        run: |
          # Create a temporary file for output
          OUTPUT_FILE="accessibility_results.json"
          
          # Run the Python script and capture output
          python runner/main.py > script_output.txt 2>&1 || true
          
          # Try to find the results in the script output
          if grep -q "results=" script_output.txt; then
            # Extract the JSON results
            RESULTS_JSON=$(grep "results=" script_output.txt | sed 's/results=//')
            echo "results=$RESULTS_JSON" >> $GITHUB_OUTPUT
          else
            # If no results found, create an error response
            ERROR_JSON='{"status": "error", "message": "No results found in script output"}'
            echo "results=$ERROR_JSON" >> $GITHUB_OUTPUT
          fi
          
          # Display the output for debugging
          echo "=== Script Output ==="
          cat script_output.txt

      - name: Upload Results as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-results
          path: accessibility_results.json
          retention-days: 1
