name: Sitemap Visualizer

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Sitemap URL to analyze'
        required: true
        type: string
      session_id:
        description: 'Unique session identifier'
        required: true
        type: string
      max_hops:
        description: 'Maximum number of hops to follow'
        required: false
        type: string
        default: '3'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Analyze sitemap
        run: |
          python scripts/sitemap_analyzer.py \
            --url "${{ github.event.inputs.url }}" \
            --session-id "${{ github.event.inputs.session_id }}" \
            --max-hops "${{ github.event.inputs.max_hops }}"

      - name: Upload results
        uses: actions/upload-artifact@v3
        with:
          name: sitemap-results-${{ github.event.inputs.session_id }}
          path: results/
          retention-days: 1

      - name: Create session marker
        run: |
          echo "Session marker for ${{ github.event.inputs.session_id }}" > session-marker-${{ github.event.inputs.session_id }}.txt

      - name: Upload session marker
        uses: actions/upload-artifact@v3
        with:
          name: session-marker-${{ github.event.inputs.session_id }}
          path: session-marker-${{ github.event.inputs.session_id }}.txt
          retention-days: 1
