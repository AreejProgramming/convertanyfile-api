name: Traceroute Tool

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target domain or IP address to trace'
        required: true
        default: 'example.com'
      session_id:
        description: 'Session ID for tracking'
        required: false
        default: ''

jobs:
  trace-route:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        
    - name: Generate session ID if not provided
      if: github.event.inputs.session_id == ''
      run: |
        echo "SESSION_ID=$(date +%s)-$(shuf -i 1000-9999 -n 1)" >> $GITHUB_ENV
        
    - name: Use provided session ID
      if: github.event.inputs.session_id != ''
      run: |
        echo "SESSION_ID=${{ github.event.inputs.session_id }}" >> $GITHUB_ENV
        
    - name: Create session marker
      run: |
        echo "Session ID: $SESSION_ID"
        echo "Session marker created at $(date)"
        mkdir -p session-markers
        echo "Session ID: $SESSION_ID" > session-markers/session-marker-$SESSION_ID.txt
        
    - name: Upload session marker
      uses: actions/upload-artifact@v4
      with:
        name: session-marker-${{ env.SESSION_ID }}
        path: session-markers/
        retention-days: 1
        
    - name: Trace route
      env:
        TARGET: ${{ github.event.inputs.target }}
        SESSION_ID: ${{ env.SESSION_ID }}
      run: |
        echo "Tracing route to $TARGET"
        python runner/traceroute_tool.py
        
    - name: Process results
      run: |
        # Check if results file exists
        if [ -f results.json ]; then
          echo "Results file found"
          # Create a copy with session ID in the filename
          cp results.json traceroute_results_${{ env.SESSION_ID }}.json
          
          # Display results summary
          echo "Results summary:"
          if command -v jq &> /dev/null; then
            jq -r '.status' results.json
            if [ "$(jq -r '.status' results.json)" = "success" ]; then
              echo "Target: $(jq -r '.target' results.json)"
              echo "Total hops: $(jq -r '.data.totalHops' results.json)"
              echo "Total time: $(jq -r '.data.totalTime' results.json)ms"
              echo "Execution time: $(jq -r '.data.executionTime' results.json)ms"
              
              # Display first few hops
              echo "First 5 hops:"
              jq -r '.data.hops[:5] | .[] | "Hop \(.hop): \(.ip) - \(.avgTime)ms"' results.json
            else
              echo "Error: $(jq -r '.message' results.json)"
            fi
          else
            echo "jq not available, displaying raw JSON"
            cat results.json
          fi
        else
          echo "Results file not found"
          exit 1
        fi
        
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: traceroute-results-${{ env.SESSION_ID }}
        path: |
          results.json
          traceroute_results_${{ env.SESSION_ID }}.json
        retention-days: 7
