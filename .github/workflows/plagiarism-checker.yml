name: Plagiarism Checker

on:
  workflow_dispatch:
    inputs:
      text:
        description: 'Text to check for plagiarism'
        required: true
        default: 'This is a sample text to check for plagiarism.'
      session_id:
        description: 'Session ID for tracking'
        required: false
        default: ''
      exclude_quotes:
        description: 'Whether to exclude quotes from the check'
        required: false
        default: 'false'
      check_type:
        description: 'Type of plagiarism check to perform'
        required: false
        default: 'comprehensive'

env:
  PYTHONUNBUFFERED: 1

jobs:
  plagiarism-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8  # Increased from 10 to 8 minutes to allow for overhead
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        sudo apt-get install -y jq
        
    - name: Generate session ID if not provided
      if: github.event.inputs.session_id == ''
      run: |
        echo "SESSION_ID=$(date +%s)-$(shuf -i 1000-9999 -n 1)" >> $GITHUB_ENV
        echo "Generated session ID: $SESSION_ID"
        
    - name: Use provided session ID
      if: github.event.inputs.session_id != ''
      run: |
        echo "SESSION_ID=${{ github.event.inputs.session_id }}" >> $GITHUB_ENV
        echo "Using provided session ID: $SESSION_ID"
        
    - name: Validate inputs
      run: |
        echo "Text length: ${#TEXT}"
        echo "Session ID: $SESSION_ID"
        echo "Exclude quotes: $EXCLUDE_QUOTES"
        echo "Check type: $CHECK_TYPE"
        
    - name: Check Plagiarism
      env:
        TEXT: ${{ github.event.inputs.text }}
        SESSION_ID: ${{ env.SESSION_ID }}
        EXCLUDE_QUOTES: ${{ github.event.inputs.exclude_quotes }}
        CHECK_TYPE: ${{ github.event.inputs.check_type }}
      run: |
        echo "Running plagiarism checker..."
        # Run with timeout to ensure we don't exceed the GitHub Actions limit
        timeout 300 python runner/plagiarism_checker.py || {
          echo "Plagiarism check timed out after 5 minutes"
          exit 1
        }
        
        # Check if results file was created
        if [ -f results.json ]; then
          echo "✅ Results file created successfully"
          cat results.json
        else
          echo "❌ Results file not found"
          exit 1
        fi
        
    - name: Validate results
      run: |
        if [ -f results.json ]; then
          STATUS=$(jq -r '.status' results.json)
          echo "Result status: $STATUS"
          
          if [ "$STATUS" = "success" ]; then
            echo "✅ Plagiarism check completed successfully"
          else
            echo "❌ Plagiarism check failed"
            jq -r '.message' results.json
            exit 1
          fi
        else
          echo "❌ Results file missing"
          exit 1
        fi
        
    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: plagiarism-results-${{ env.SESSION_ID }}
        path: results.json
        retention-days: 1
        
    - name: Create summary
      run: |
        if [ -f results.json ]; then
          SCORE=$(jq -r '.data.score // 0' results.json)
          SOURCES_COUNT=$(jq -r '.data.sources | length // 0' results.json)
          
          echo "📊 **Plagiarism Check Results**" >> $GITHUB_STEP_SUMMARY
          echo "- **Similarity Score**: $SCORE%" >> $GITHUB_STEP_SUMMARY
          echo "- **Sources Found**: $SOURCES_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- **Session ID**: $SESSION_ID" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Plagiarism Check Failed**" >> $GITHUB_STEP_SUMMARY
        fi
