name: Google Cache Analysis

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to check for Google cache'
        required: true
        type: string
      session_id:
        description: 'Session identifier'
        required: true
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run Cache Analysis
        id: analysis
        env:
          TARGET_URL: ${{ github.event.inputs.url }}
          SESSION_ID: ${{ github.event.inputs.session_id }}
        run: |
          python check_google_cache.py

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: cache-results-${{ github.event.inputs.session_id }}
          path: results.json
          retention-days: 1
