name: Google Cache Analysis

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to check for Google cache'
        required: true
        type: string
      session_id:
        description: 'Session identifier'
        required: true
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run Cache Analysis
        id: analysis
        env:
          TARGET_URL: ${{ github.event.inputs.url }}
          SESSION_ID: ${{ github.event.inputs.session_id }}
        run: |
          python -c "
import os
import json
import requests
from urllib.parse import quote
import time

def check_cache(url):
    try:
        if not url.startswith(('http://', 'https://')):
            url = 'https://' + url
            
        encoded_url = quote(url, safe='')
        cache_url = f'https://webcache.googleusercontent.com/search?q=cache:{encoded_url}'
        
        headers = {
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
        }
        
        response = requests.get(cache_url, headers=headers, timeout=10)
        
        if response.status_code == 200 and 'Google has not cached' not in response.text:
            return {
                'status': 'success',
                'available': True,
                'cache_url': cache_url,
                'original_url': url,
                'message': 'Cache found'
            }
        else:
            return {
                'status': 'success',
                'available': False,
                'cache_url': None,
                'original_url': url,
                'message': 'No cache available'
            }
    except Exception as e:
        return {
            'status': 'error',
            'message': str(e),
            'available': False
        }

url = os.environ.get('TARGET_URL', '')
result = check_cache(url)
result['session_id'] = os.environ.get('SESSION_ID', 'unknown')

print(f'RESULTS_JSON={json.dumps(result)}')
          " > results.json
          
          # Extract the JSON from the output
          grep "RESULTS_JSON=" results.json | sed 's/RESULTS_JSON=//' > final_results.json
          
          # If extraction failed, create a default error file
          if [ ! -s final_results.json ]; then
            echo '{"status": "error", "message": "Failed to process results", "session_id": "'${SESSION_ID}'"}' > final_results.json
          fi
          
          echo "results_file=final_results.json" >> $GITHUB_OUTPUT

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: cache-results-${{ github.event.inputs.session_id }}
          path: final_results.json
          retention-days: 1
