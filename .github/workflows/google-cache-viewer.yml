name: Run Google Cache Analysis

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to check for Google cache'
        required: true
        type: string
      session_id:
        description: 'Unique session identifier'
        required: true
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Create session marker
        run: |
          echo "Session ID: ${{ github.event.inputs.session_id }}" > session_marker.txt
          echo "URL: ${{ github.event.inputs.url }}" >> session_marker.txt
          echo "Timestamp: $(date +%s)" >> session_marker.txt
          echo "Workflow Run ID: ${{ github.run_id }}" >> session_marker.txt

      - name: Run Google Cache Analysis
        id: run_analysis
        env:
          TARGET_URL: ${{ github.event.inputs.url }}
          SESSION_ID: ${{ github.event.inputs.session_id }}
        run: |
          OUTPUT_FILE="google_cache_results.json"
          
          python runner/google_cache_checker.py > script_output.txt 2>&1
          SCRIPT_EXIT_CODE=$?
          
          echo "=== Script Output ==="
          cat script_output.txt
          echo "=== Script Exit Code: $SCRIPT_EXIT_CODE ==="
          
          if grep -q "results=" script_output.txt; then
            grep "results=" script_output.txt | sed 's/results=//' > "$OUTPUT_FILE"
            echo "Results extracted to $OUTPUT_FILE"
            echo "=== Extracted Results ==="
            cat "$OUTPUT_FILE"
          else
            ERROR_MESSAGE="No results found in script output"
            if [ -s script_output.txt ]; then
              ERROR_MESSAGE="$ERROR_MESSAGE. Script output: $(cat script_output.txt | head -c 200)"
            fi
            
            echo '{"status": "error", "message": "'"$ERROR_MESSAGE"'"}' > "$OUTPUT_FILE"
            echo "Created error response: $ERROR_MESSAGE"
          fi
          
          echo "output_file=$OUTPUT_FILE" >> $GITHUB_OUTPUT

      - name: Upload Results as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: google-cache-results-${{ github.event.inputs.session_id }}
          path: ${{ steps.run_analysis.outputs.output_file }}
          retention-days: 1
          
      - name: Upload Session Marker
        uses: actions/upload-artifact@v4
        with:
          name: session-marker-${{ github.event.inputs.session_id }}
          path: session_marker.txt
          retention-days: 1
