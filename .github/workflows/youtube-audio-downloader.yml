# File: .github/workflows/youtube-audio-downloader.yml

name: YouTube Audio Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube video URL'
        required: true
        type: string
      quality:
        description: 'Audio quality'
        required: true
        default: '128kbps'
        type: choice
        options:
          - '64kbps'
          - '128kbps'
          - '192kbps'
          - '256kbps'
          - '320kbps'
      session_id:
        description: 'Unique session identifier'
        required: true
        type: string
      action:
        description: 'Action to perform'
        required: true
        default: 'info'
        type: choice
        options:
          - 'info'
          - 'download'

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp requests

      - name: Get YouTube Cookies
        id: get_cookies
        run: |
          # Try to get cookies from secrets or use a rotating proxy service
          if [ -n "${{ secrets.YOUTUBE_COOKIES }}" ]; then
            echo "Using cookies from secrets"
            echo "YOUTUBE_COOKIES<<EOF" >> $GITHUB_ENV
            echo "${{ secrets.YOUTUBE_COOKIES }}" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "No cookies available, will try alternative methods"
          fi

      - name: Process YouTube Video
        id: process_video
        env:
          TARGET_URL: ${{ github.event.inputs.url }}
          TARGET_QUALITY: ${{ github.event.inputs.quality }}
          SESSION_ID: ${{ github.event.inputs.session_id }}
          ACTION: ${{ github.event.inputs.action }}
          YOUTUBE_COOKIES: ${{ env.YOUTUBE_COOKIES }}
        run: |
          # Create a session marker file for easier tracking
          echo "Session ID: $SESSION_ID" > session_marker_${SESSION_ID}.txt
          echo "URL: $TARGET_URL" >> session_marker_${SESSION_ID}.txt
          echo "Quality: $TARGET_QUALITY" >> session_marker_${SESSION_ID}.txt
          echo "Action: $ACTION" >> session_marker_${SESSION_ID}.txt
          echo "Timestamp: $(date +%s)" >> session_marker_${SESSION_ID}.txt
          echo "Has cookies: $([ -n "$YOUTUBE_COOKIES" ] && echo "Yes" || echo "No")" >> session_marker_${SESSION_ID}.txt
          
          # Run the Python script and capture both stdout and stderr
          python runner/youtube_audio_downloader.py > script_output.txt 2>&1 || true
          
          # Display the output for debugging
          echo "=== Script Output ==="
          cat script_output.txt
          
          # Determine output file based on action
          if [ "$ACTION" = "info" ]; then
            OUTPUT_FILE="video_info_${SESSION_ID}.json"
            ARTIFACT_NAME="video-info-${SESSION_ID}"
          else
            OUTPUT_FILE="download_results_${SESSION_ID}.json"
            ARTIFACT_NAME="audio-download-${SESSION_ID}"
          fi
          
          # Try to find the results in the script output
          if grep -q "results=" script_output.txt; then
            # Extract the JSON results
            grep "results=" script_output.txt | sed 's/results=//' > "$OUTPUT_FILE"
            echo "Results extracted to $OUTPUT_FILE"
          else
            # If no results found, create an error response
            echo '{"status": "error", "message": "No results found in script output"}' > "$OUTPUT_FILE"
          fi
          
          # Display the extracted results for debugging
          echo "=== Extracted Results ==="
          cat "$OUTPUT_FILE"
          
          # If this is a download action and successful, include the audio file
          if [ "$ACTION" = "download" ]; then
            # Extract filename from results
            AUDIO_FILE=$(grep -o '"filename":"[^"]*"' "$OUTPUT_FILE" | sed 's/"filename":"\([^"]*\)"/\1/')
            if [ -n "$AUDIO_FILE" ] && [ -f "$AUDIO_FILE" ]; then
              echo "Found audio file: $AUDIO_FILE"
              echo "audio_file=$AUDIO_FILE" >> $GITHUB_OUTPUT
            fi
          fi
          
          # Save the file path for the next step
          echo "output_file=$OUTPUT_FILE" >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

      - name: Upload Results as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.process_video.outputs.artifact_name }}
          path: ${{ steps.process_video.outputs.output_file }}
          retention-days: 1
          
      - name: Upload Audio File (if download)
        if: github.event.inputs.action == 'download' && steps.process_video.outputs.audio_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.process_video.outputs.artifact_name }}
          path: ${{ steps.process_video.outputs.audio_file }}
          retention-days: 1
          
      - name: Upload Session Marker
        uses: actions/upload-artifact@v4
        with:
          name: session-marker-${{ github.event.inputs.session_id }}
          path: session_marker_${{ github.event.inputs.session_id }}.txt
          retention-days: 1
