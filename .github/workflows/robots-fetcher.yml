name: Robots.txt Fetcher Tool

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Website URL to fetch robots.txt from'
        required: true
        default: 'https://www.google.com'
      session_id:
        description: 'Session ID for tracking'
        required: false
        default: ''

jobs:
  fetch-robots:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        
    - name: Generate session ID if not provided
      if: github.event.inputs.session_id == ''
      run: |
        echo "SESSION_ID=$(date +%s)-$(shuf -i 1000-9999 -n 1)" >> $GITHUB_ENV
        echo "SESSION_ID=${{ env.SESSION_ID }}" >> $GITHUB_ENV
        
    - name: Use provided session ID
      if: github.event.inputs.session_id != ''
      run: |
        echo "SESSION_ID=${{ github.event.inputs.session_id }}" >> $GITHUB_ENV
        
    - name: Create session marker
      run: |
        echo "Session ID: $SESSION_ID"
        echo "Session marker created at $(date)"
        mkdir -p session-markers
        echo "Session ID: $SESSION_ID" > session-markers/session-marker-$SESSION_ID.txt
        
    - name: Upload session marker
      uses: actions/upload-artifact@v4
      with:
        name: session-marker-${{ env.SESSION_ID }}
        path: session-markers/
        retention-days: 1
        
    - name: Fetch robots.txt
      env:
        URL: ${{ github.event.inputs.url }}
        SESSION_ID: ${{ env.SESSION_ID }}
      run: |
        echo "Fetching robots.txt for: $URL"
        echo "Session ID: $SESSION_ID"
        python runner/robots_fetcher.py
        
    # *** CRITICAL FIX 1: Always run the upload step, even if the fetch step fails ***
    - name: Upload results
      # The 'if: always()' ensures this step runs regardless of previous step's outcome
      if: always() 
      uses: actions/upload-artifact@v4
      with:
        name: robots-results-${{ env.SESSION_ID }}
        # *** CRITICAL FIX 2: Make the path conditional ***
        # This will only upload the file if it exists. If it doesn't, the step will be skipped but not fail the whole job.
        path: |
          results.json
        retention-days: 7
